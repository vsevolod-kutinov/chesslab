# Windows build: ChessLab.exe with Stockfish inside, as a zip.
# Runs by hand (Actions -> Run workflow) and on version tags (v0.2.0 ...);
# a tag also publishes the zip as a GitHub release.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # PyInstaller's bootloader is compiled here instead of using the prebuilt
        # one: antivirus databases know the stock bootloader (malware uses it too),
        # which is the usual reason for false "Trojan" detections.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install -r requirements.txt PySide6
          pip install --no-binary pyinstaller pyinstaller

      - name: Fetch Stockfish
        shell: pwsh
        run: |
          $url = "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-windows-x86-64-universal.zip"
          Invoke-WebRequest $url -OutFile sf.zip
          Expand-Archive sf.zip -DestinationPath sf
          New-Item -ItemType Directory -Force engine | Out-Null
          Copy-Item sf/stockfish/stockfish-windows-x86-64-universal.exe engine/stockfish.exe
          Copy-Item sf/stockfish/Copying.txt engine/Stockfish-COPYING.txt

      - name: Build
        run: |
          python tools/version_info.py
          pyinstaller --noconfirm chesslab.spec

      - name: Self-test the build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process dist/ChessLab/ChessLab.exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist/ChessLab/
          Copy-Item engine/Stockfish-COPYING.txt dist/ChessLab/
          Compress-Archive dist/ChessLab ChessLab-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChessLab-windows
          path: ChessLab-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ChessLab-windows.zip
